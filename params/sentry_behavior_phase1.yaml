behavior_server:
  ros__parameters:
    use_sim_time: false
    action_name: pb2025_sentry_behavior
    tick_frequency: 20  # Hz：每 50ms 执行一次树，战斗速度刷新周期短于 Hub 的 0.2s 有效期。
    groot2_port: 0
    ros_plugins_timeout: 1000
    use_cout_logger: false

    plugins:
      - behavior/bt_plugins

    behavior_trees:
      - behavior/behavior_trees

behavior_client:
  ros__parameters:
    use_sim_time: false
    target_tree: competition_phase1
